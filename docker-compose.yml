version: '3.8'

services:
  # CloudPulse Monitor Backend (Java Spring Boot)
  cloudpulse-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    volumes:
      - ./data:/app/data # SQLite database persistence
    networks:
      - cloudpulse-network
    healthcheck:
      # Placeholder healthcheck until Spring is fully operational
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # CloudPulse Monitor Frontend (Vue.js)
  cloudpulse-frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: cloudpulse-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - cloudpulse-backend
    networks:
      - cloudpulse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  cloudpulse-network:
    driver: bridge